[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Proyecto integrador MiBici: regresi\u00f3n, clasificaci\u00f3n y clustering"
authors = [
  { name = "Equipo 6" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.13.0"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "notebooks", "data", "mlruns", "mlartifacts"]

