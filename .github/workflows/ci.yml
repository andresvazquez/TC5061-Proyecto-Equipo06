name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruta:
          - tests/api
          - tests/modeling
          - tests --ignore=tests/api --ignore=tests/modeling

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest ${{ matrix.ruta }}

  construir_imagen:
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Containerfile
          push: false
          tags: mibici-api